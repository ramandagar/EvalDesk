[project]
name = "evaldesk"
version = "0.8.0"
description = "Official Python SDK for EvalDesk — Multi-model AI agent evaluation & compliance verification"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Raman Dagar", email = "ramandagar479@gmail.com" }
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://evaldesk.dev"
Repository = "https://github.com/ramandagar/EvalDesk"
Documentation = "https://evaldesk.dev/docs"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["evaldesk*"]
